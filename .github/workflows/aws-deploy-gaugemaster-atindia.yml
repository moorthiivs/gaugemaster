name: Deploy Gaugemaster ATINDIA to AWS

on:
  push:
    branches:
      - atindia

  workflow_dispatch:

concurrency:
  group: gaugemaster-atindia-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy Gaugemaster ATINDIA
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # --------------------------------------------------
      # 3. Build frontend
      # --------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # --------------------------------------------------
      # 4. Copy frontend into backend public
      # --------------------------------------------------
      - name: Copy frontend build to backend public
        run: |
          set -e

          rm -rf backend/src/public
          mkdir -p backend/src/public

          cp -R frontend/dist/. backend/src/public/

      # --------------------------------------------------
      # 5. Install backend dependencies
      # --------------------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --legacy-peer-deps

      # --------------------------------------------------
      # 6. Build backend
      # --------------------------------------------------
      - name: Build backend
        working-directory: backend
        run: npm run build

      # --------------------------------------------------
      # 7. Include certificate-generation fonts
      # --------------------------------------------------
      - name: Prepare certificate fonts
        run: |
          set -e

          echo "======================================"
          echo "Checking certificate fonts"
          echo "======================================"

          # Preferred production location:
          # backend/fonts/
          if [ -d "backend/fonts" ]; then
            echo "Found backend/fonts"

            mkdir -p backend/dist/fonts
            cp -R backend/fonts/. backend/dist/fonts/

          # Fallback if fonts are currently under src/fonts
          elif [ -d "backend/src/fonts" ]; then
            echo "Found backend/src/fonts"

            mkdir -p backend/dist/fonts
            cp -R backend/src/fonts/. backend/dist/fonts/

          else
            echo "WARNING: No backend/fonts or backend/src/fonts directory found."
            echo "Certificate generation may fail if fonts are required."
          fi

          echo ""
          echo "Fonts in production build:"
          if [ -d "backend/dist/fonts" ]; then
            find backend/dist/fonts -type f -maxdepth 2 -print
          else
            echo "No fonts directory in backend/dist"
          fi

      # --------------------------------------------------
      # 8. Remove development dependencies
      # --------------------------------------------------
      - name: Prepare production backend
        working-directory: backend
        run: npm prune --omit=dev

      # --------------------------------------------------
      # 9. Verify build
      # --------------------------------------------------
      - name: Verify build
        run: |
          set -e

          test -f backend/dist/main.js
          test -f backend/src/public/index.html

          echo "======================================"
          echo "ATINDIA Backend build"
          echo "======================================"
          ls -lh backend/dist/main.js

          echo ""
          echo "======================================"
          echo "ATINDIA Frontend build"
          echo "======================================"
          ls -lh backend/src/public/index.html

          echo ""
          echo "======================================"
          echo "Certificate fonts"
          echo "======================================"

          if [ -d "backend/dist/fonts" ]; then
            find backend/dist/fonts -type f -print
          else
            echo "WARNING: backend/dist/fonts does not exist"
          fi

      # --------------------------------------------------
      # 10. Create deployment archive
      # --------------------------------------------------
      - name: Create deployment package
        run: |
          set -e

          PACKAGE="gaugemaster-atindia-${{ github.sha }}.tar.gz"

          echo "Creating deployment package: $PACKAGE"

          tar \
            --exclude='backend/.env' \
            --exclude='backend/.env.*' \
            --exclude='backend/test' \
            --exclude='backend/src' \
            --exclude='backend/dist/public' \
            -czf "$PACKAGE" \
            -C backend \
            dist \
            package.json \
            package-lock.json \
            node_modules

          echo ""
          echo "======================================"
          echo "Deployment package"
          echo "======================================"

          ls -lh "$PACKAGE"

          echo ""
          echo "Checking package contents..."

          tar -tzf "$PACKAGE" | grep -E '^dist/fonts/' || true

          echo ""
          echo "IMPORTANT:"
          echo "uploads are NOT included in the deployment package."
          echo "Customer uploads remain in shared/uploads on AWS."

      # --------------------------------------------------
      # 11. Configure SSH
      # --------------------------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.AWS_SSH_KEY }}" \
            > ~/.ssh/github_actions

          chmod 600 ~/.ssh/github_actions

          printf '%s\n' "${{ secrets.AWS_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # --------------------------------------------------
      # 12. Upload package to AWS
      # --------------------------------------------------
      - name: Upload deployment package
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -e

          PACKAGE="gaugemaster-atindia-${{ github.sha }}.tar.gz"

          echo "Deployment package:"
          ls -lh "$PACKAGE"

          scp \
            -i ~/.ssh/github_actions \
            -o StrictHostKeyChecking=yes \
            "$PACKAGE" \
            "${AWS_USER}@${AWS_HOST}:/tmp/"

      # --------------------------------------------------
      # 13. Deploy on AWS
      # --------------------------------------------------
      - name: Deploy on AWS
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh \
            -i ~/.ssh/github_actions \
            -o StrictHostKeyChecking=yes \
            "${AWS_USER}@${AWS_HOST}" \
            "GITHUB_SHA=${{ github.sha }} bash -s" <<'REMOTE_SCRIPT'

          set -e

          APP_NAME="gaugemaster-atindia"
          APP_DIR="/srv/customer/gaugemaster-atindia"
          RELEASE_DIR="$APP_DIR/releases/$GITHUB_SHA"
          PACKAGE="/tmp/gaugemaster-atindia-$GITHUB_SHA.tar.gz"

          echo "======================================"
          echo "Deploying Gaugemaster ATINDIA"
          echo "Commit: $GITHUB_SHA"
          echo "App: $APP_NAME"
          echo "Directory: $APP_DIR"
          echo "======================================"

          # ------------------------------------------------
          # 1. Verify application directories
          # ------------------------------------------------
          mkdir -p "$APP_DIR/releases"
          mkdir -p "$APP_DIR/shared"

          # ------------------------------------------------
          # 2. Create persistent upload directories
          # ------------------------------------------------
          echo ""
          echo "Preparing persistent upload storage..."

          mkdir -p "$APP_DIR/shared/uploads"
          mkdir -p "$APP_DIR/shared/uploads/certificates"
          mkdir -p "$APP_DIR/shared/uploads/calibration-procedures"
          mkdir -p "$APP_DIR/shared/uploads/gauge-diagrams"
          mkdir -p "$APP_DIR/shared/uploads/logos"
          mkdir -p "$APP_DIR/shared/uploads/work-instructions"

          # ------------------------------------------------
          # 3. Verify production environment
          # ------------------------------------------------
          if [ ! -f "$APP_DIR/shared/.env" ]; then
            echo "ERROR: Production .env not found:"
            echo "$APP_DIR/shared/.env"
            exit 1
          fi

          # ------------------------------------------------
          # 4. Verify deployment package
          # ------------------------------------------------
          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: Deployment package not found:"
            echo "$PACKAGE"
            exit 1
          fi

          # ------------------------------------------------
          # 5. Create release directory
          # ------------------------------------------------
          mkdir -p "$RELEASE_DIR"

          # ------------------------------------------------
          # 6. Extract deployment
          # ------------------------------------------------
          echo ""
          echo "Extracting release..."

          tar -xzf "$PACKAGE" -C "$RELEASE_DIR"

          # ------------------------------------------------
          # 7. Validate release
          # ------------------------------------------------
          test -f "$RELEASE_DIR/dist/main.js"
          test -f "$RELEASE_DIR/package.json"

          echo ""
          echo "Release validated:"
          echo "$RELEASE_DIR"

          # ------------------------------------------------
          # 8. Protect customer uploads
          #
          # NEVER store customer uploads inside releases.
          # ------------------------------------------------
          echo ""
          echo "Configuring persistent uploads..."

          rm -rf "$RELEASE_DIR/uploads"

          ln -s \
            "$APP_DIR/shared/uploads" \
            "$RELEASE_DIR/uploads"

          # ------------------------------------------------
          # 9. Verify uploads symlink
          # ------------------------------------------------
          echo ""
          echo "Uploads configuration:"

          ls -lah "$RELEASE_DIR/uploads"

          UPLOAD_TARGET=$(readlink -f "$RELEASE_DIR/uploads")

          if [ "$UPLOAD_TARGET" != "$APP_DIR/shared/uploads" ]; then
            echo "ERROR: uploads symlink is incorrect."
            echo "Expected:"
            echo "$APP_DIR/shared/uploads"
            echo "Actual:"
            echo "$UPLOAD_TARGET"
            exit 1
          fi

          echo "Uploads correctly mapped to:"
          echo "$UPLOAD_TARGET"

          # ------------------------------------------------
          # 10. Connect production environment
          # ------------------------------------------------
          ln -sfn \
            "$APP_DIR/shared/.env" \
            "$RELEASE_DIR/.env"

          # ------------------------------------------------
          # 11. Verify certificate fonts
          # ------------------------------------------------
          echo ""
          echo "Checking certificate fonts..."

          if [ -d "$RELEASE_DIR/dist/fonts" ]; then
            FONT_COUNT=$(find "$RELEASE_DIR/dist/fonts" -type f | wc -l)

            echo "Certificate font files: $FONT_COUNT"

            if [ "$FONT_COUNT" -eq 0 ]; then
              echo "WARNING: dist/fonts exists but contains no files."
            fi
          else
            echo "WARNING: $RELEASE_DIR/dist/fonts does not exist."
            echo "Verify certificate font location in repository."
          fi

          # ------------------------------------------------
          # 12. Load production environment
          # ------------------------------------------------
          set -a
          source "$APP_DIR/shared/.env"
          set +a

          echo ""
          echo "ATINDIA PORT=$PORT"

          # ------------------------------------------------
          # 13. Update current ONLY after release is ready
          # ------------------------------------------------
          echo ""
          echo "Updating current symlink..."

          ln -sfn \
            "$RELEASE_DIR" \
            "$APP_DIR/current"

          echo "Current release:"
          readlink -f "$APP_DIR/current"

          # ------------------------------------------------
          # 14. Start / restart PM2
          # ------------------------------------------------
          cd "$APP_DIR/current"

          if pm2 describe gaugemaster-atindia-api > /dev/null 2>&1; then

            echo ""
            echo "Restarting Gaugemaster ATINDIA API..."

            pm2 restart gaugemaster-atindia-api --update-env

          else

            echo ""
            echo "Starting Gaugemaster ATINDIA API..."

            pm2 start dist/main.js \
              --name gaugemaster-atindia-api \
              --cwd "$APP_DIR/current"

          fi

          # ------------------------------------------------
          # 15. Save PM2 process list
          # ------------------------------------------------
          pm2 save

          # ------------------------------------------------
          # 16. Remove uploaded deployment package
          # ------------------------------------------------
          rm -f "$PACKAGE"

          # ------------------------------------------------
          # 17. Keep latest 5 releases
          # ------------------------------------------------
          cd "$APP_DIR/releases"

          ls -1dt */ 2>/dev/null \
            | tail -n +6 \
            | xargs -r rm -rf

          # ------------------------------------------------
          # 18. Final deployment verification
          # ------------------------------------------------
          echo ""
          echo "======================================"
          echo "Final deployment verification"
          echo "======================================"

          echo ""
          echo "PM2 status:"
          pm2 status

          echo ""
          echo "Current release:"
          readlink -f "$APP_DIR/current"

          echo ""
          echo "Uploads target:"
          readlink -f "$APP_DIR/current/uploads"

          echo ""
          echo "Certificate files:"
          find "$APP_DIR/shared/uploads/certificates" \
            -maxdepth 1 \
            -type f | wc -l

          echo ""
          echo "Certificate fonts:"

          if [ -d "$APP_DIR/current/dist/fonts" ]; then
            find "$APP_DIR/current/dist/fonts" -type f -maxdepth 2
          else
            echo "WARNING: certificate fonts directory not found"
          fi

          echo ""
          echo "======================================"
          echo "ATINDIA deployment completed successfully"
          echo "======================================"

          REMOTE_SCRIPT